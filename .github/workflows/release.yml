name: Release

# Runs on every merge or direct push to main. It only publishes when the version
# in transcriber/__init__.py has no release yet, so ordinary commits are free:
# bump the version to ship, leave it alone to keep working.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    name: Should this publish?
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      tag: ${{ steps.check.outputs.tag }}
      publish: ${{ steps.check.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: check
        name: Read the version and look for an existing release
        run: |
          version=$(python -c "import re,pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('transcriber/__init__.py').read_text()).group(1))")
          tag="v${version}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} already released. Bump __version__ to publish a new one."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
            echo "::notice::${tag} has no release yet. Building the installers."
          fi

  build:
    name: ${{ matrix.label }}
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            label: macOS (Apple Silicon)
            artifact: Transcriber-macos-arm64
          - os: macos-13
            label: macOS (Intel)
            artifact: Transcriber-macos-x86_64
          - os: windows-latest
            label: Windows (x64)
            artifact: Transcriber-windows-x86_64
          - os: ubuntu-22.04
            label: Ubuntu (x64)
            artifact: Transcriber-linux-x86_64
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tk (Ubuntu only)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev

      # Fail here with a clear message instead of shipping a binary whose
      # interface cannot start on the user's machine.
      - name: Tkinter is available
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Tests
        run: python -m pytest -q

      - name: Build
        run: pyinstaller --noconfirm --clean Transcriber.spec

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname "Transcriber" \
            -srcfolder "dist/Transcriber.app" \
            -ov -format UDZO "${{ matrix.artifact }}.dmg"

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/Transcriber.exe -DestinationPath ${{ matrix.artifact }}.zip
        shell: pwsh

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: tar -czf ${{ matrix.artifact }}.tar.gz -C dist Transcriber

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            *.dmg
            *.zip
            *.tar.gz
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish ${{ needs.version.outputs.tag }}
    needs: [version, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List what will be published
        run: ls -lh artifacts

      # Creates the tag on this commit as part of publishing, so the version in
      # the source and the tag in the repository can never drift apart.
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          # Explicit so a release never lands as a draft or a pre-release, which
          # hides it from the "latest release" link people actually click.
          draft: false
          prerelease: false
          make_latest: true
          files: artifacts/*
          body: |
            Binários não assinados: os modelos Whisper **não** vão embutidos e são
            baixados no primeiro uso (precisa de internet uma vez).

            - **macOS**: abra o `.dmg`, arraste para Aplicativos. Na primeira execução,
              o Gatekeeper bloqueia por falta de assinatura — clique com o botão direito
              no app e escolha *Abrir*, ou rode
              `xattr -dr com.apple.quarantine "/Applications/Transcriber.app"`.
            - **Windows**: extraia o `.zip` e rode `Transcriber.exe`. O SmartScreen
              pode avisar por ser um executável não assinado.
            - **Ubuntu**: extraia o `.tar.gz` e rode `./Transcriber/Transcriber`.
              Requer `libtk` no sistema (`sudo apt install python3-tk`).
