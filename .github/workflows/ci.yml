name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # The test suite touches no Whisper model and no Tkinter widget, so the
      # heavy runtime dependencies are not installed here. That keeps this job
      # under a minute; the full install is exercised by the smoke job below.
      - name: Install test tooling
        run: python -m pip install --upgrade pip pytest pyflakes

      - name: Lint
        run: python -m pyflakes app.py conftest.py transcriber tests

      - name: Tests
        run: python -m pytest -q

  smoke:
    name: full install + headless window
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Tk and a virtual display
        run: sudo apt-get update && sudo apt-get install -y python3-tk tk-dev xvfb

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Tkinter is available
        run: python -c "import tkinter; print('Tk', tkinter.TkVersion)"

      # Builds the real window on a virtual display and tears it down. Catches
      # layout and theming errors that unit tests cannot see.
      - name: Build the window headlessly
        run: |
          xvfb-run -a python - <<'PY'
          from transcriber.logging_setup import setup_logging
          from transcriber.ui.main_window import MainWindow

          setup_logging()
          window = MainWindow()
          window.update()
          assert window._transcribe_button is not None
          assert window._action_buttons, "result actions missing"
          window._show_empty_state()
          window.update()
          window.destroy()
          print("window built and destroyed cleanly")
          PY
